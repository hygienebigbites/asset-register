<!DOCTYPE html>
<html>
<head>

  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Kitchen Asset Register</title>

  <style>

    :root {
      --ink: #111827;
      --text: #1f2937;
      --muted: #6b7280;
      --line: #e5e7eb;
      --bg: #f3f4f6;
      --soft: #f9fafb;
      --ok: #166534;
      --okbg: #dcfce7;
      --err: #b91c1c;
      --errbg: #fee2e2;
      --info: #1e40af;
      --infobg: #dbeafe;
      --warn: #92400e;
      --warnbg: #fef3c7;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding-bottom: 84px;
      -webkit-tap-highlight-color: transparent;
    }
    button { font-family: inherit; color: inherit; }
    input, select, textarea {
      width: 100%;
      padding: 9px 10px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      background: #fff;
      font-size: 16px;               /* 16px stops iPhone auto-zoom */
      font-family: inherit;
      color: var(--text);
    }
    input:focus, select:focus, textarea:focus { outline: none; border-color: #6b7280; }
    textarea { min-height: 64px; resize: vertical; }

    /* ---------- top (sticky) ---------- */

    .top {
      position: sticky; top: 0; z-index: 20;
      background: var(--ink); color: #fff;
      padding: 10px 12px 0;
    }
    .top-row { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; max-width: 760px; margin: auto; }
    .top h1 { margin: 0; font-size: 16px; }
    .top .sub { font-size: 12px; color: #d1d5db; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .tabs { display: flex; max-width: 760px; margin: 8px auto 0; }
    .tab {
      flex: 1; background: none; border: none; color: #9ca3af;
      padding: 10px 4px; font-size: 14px; font-weight: bold; cursor: pointer;
      border-bottom: 3px solid transparent;
    }
    .tab.on { color: #fff; border-bottom-color: #fff; }
    .tab .pill { display: inline-block; margin-left: 4px; background: #374151; color: #fff; border-radius: 999px; padding: 1px 7px; font-size: 11.5px; }
    .tab.on .pill { background: #fff; color: var(--ink); }

    .wrap { max-width: 760px; margin: auto; padding: 10px; }

    /* ---------- outlet / name / mobile in one row ---------- */

    .who {
      display: grid;
      grid-template-columns: 1.3fr 1fr 1fr;
      gap: 6px;
      background: #fff; border-radius: 12px; padding: 8px;
      box-shadow: 0 1px 4px rgba(0,0,0,.06);
      margin-bottom: 10px;
    }
    .who label { display: block; min-width: 0; }
    .who .k { display: block; font-size: 10.5px; font-weight: bold; color: var(--muted); margin: 0 0 3px 2px; text-transform: uppercase; letter-spacing: .03em; }
    .who select, .who input { padding: 8px 6px; }
    .who .err select, .who .err input { border-color: var(--err); background: #fff7f7; }
    .req { color: #dc2626; }

    /* ---------- count view ---------- */

    .jump { display: flex; gap: 6px; overflow-x: auto; padding: 2px 0 8px; scrollbar-width: none; }
    .jump::-webkit-scrollbar { display: none; }
    .jump button {
      flex: none; border: 1px solid var(--line); background: #fff; border-radius: 999px;
      padding: 7px 12px; font-size: 12.5px; cursor: pointer; white-space: nowrap;
    }
    .jump b { color: var(--ink); }

    .grp { scroll-margin-top: 104px; }
    .grp h3 {
      margin: 6px 2px 8px; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted);
      display: flex; justify-content: space-between;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px; margin-bottom: 14px;
    }
    @media (min-width: 560px) { .grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }

    .cc {
      background: #fff; border: 1.5px solid var(--line); border-radius: 12px;
      padding: 6px 6px 8px; display: flex; flex-direction: column; align-items: stretch;
      position: relative;
    }
    .cc.on { border-color: var(--ink); box-shadow: 0 0 0 1px var(--ink) inset; }
    .cimg {
      height: 64px; border-radius: 8px; background: #fff;
      display: flex; align-items: center; justify-content: center; overflow: hidden;
    }
    .cimg img { width: 100%; height: 100%; object-fit: contain; }
    .emo { font-size: 34px; line-height: 1; }
    .cname { font-size: 12px; line-height: 1.25; text-align: center; margin: 6px 0; min-height: 30px; display: flex; align-items: center; justify-content: center; }
    .step { display: flex; align-items: center; border: 1px solid #d1d5db; border-radius: 9px; overflow: hidden; }
    .step button { width: 32px; height: 36px; flex: none; border: none; background: var(--bg); font-size: 20px; cursor: pointer; }
    .step button:active { background: #e5e7eb; }
    .step input { border: none; border-radius: 0; text-align: center; font-weight: bold; padding: 0; height: 36px; min-width: 0; }
    .cc.on .step input { color: var(--ink); }
    .creg { position: absolute; top: 4px; right: 4px; background: var(--okbg); color: var(--ok); font-size: 10px; font-weight: bold; border-radius: 999px; padding: 2px 6px; }
    .cnote { font-size: 10.5px; color: var(--warn); text-align: center; margin-top: 4px; line-height: 1.2; }

    /* ---------- register view ---------- */

    .banner {
      display: flex; align-items: center; gap: 10px;
      background: var(--warnbg); color: var(--warn); border-radius: 12px;
      padding: 12px; margin-bottom: 10px; font-size: 13.5px; line-height: 1.35;
    }
    .banner b { color: #78350f; }
    .banner button { margin-left: auto; flex: none; }

    .summary { font-size: 13px; color: var(--muted); margin: 2px 2px 8px; display: flex; justify-content: space-between; }
    .bar { height: 6px; border-radius: 99px; background: #e5e7eb; overflow: hidden; margin: 0 2px 12px; }
    .bar i { display: block; height: 100%; background: var(--ok); width: 0; transition: width .3s; }

    .list { background: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,.06); margin-bottom: 12px; }
    .lh { font-size: 11.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); padding: 10px 12px 4px; background: var(--soft); }
    .row {
      display: flex; align-items: center; gap: 10px; padding: 10px 12px;
      border-top: 1px solid var(--line); cursor: pointer; width: 100%; background: #fff; border-left: none; border-right: none; border-bottom: none; text-align: left;
    }
    .row:active { background: var(--soft); }
    .th { width: 48px; height: 48px; border-radius: 8px; background: #fff; border: 1px solid var(--line); flex: none; display: flex; align-items: center; justify-content: center; overflow: hidden; }
    .th img { width: 100%; height: 100%; object-fit: contain; }
    .th .emo { font-size: 24px; }
    .rt { flex: 1; min-width: 0; }
    .rt b { display: block; font-size: 14px; }
    .rt span { font-size: 12px; color: var(--muted); }
    .st { flex: none; font-size: 11.5px; font-weight: bold; border-radius: 999px; padding: 4px 9px; }
    .st.todo { background: var(--bg); color: var(--text); }
    .st.part { background: var(--warnbg); color: var(--warn); }
    .st.done { background: var(--okbg); color: var(--ok); }
    .st.over { background: var(--errbg); color: var(--err); }

    .empty { text-align: center; color: var(--muted); font-size: 14px; padding: 30px 16px; line-height: 1.5; background: #fff; border-radius: 12px; }

    /* ---------- buttons ---------- */

    .btn {
      border: none; border-radius: 10px; padding: 13px 16px; font-size: 15px; font-weight: bold;
      cursor: pointer; background: var(--ink); color: #fff;
    }
    .btn:disabled { background: #9ca3af; cursor: not-allowed; }
    .btn.sec { background: #fff; color: var(--ink); border: 1.5px solid #d1d5db; }
    .btn.sm { padding: 9px 12px; font-size: 13px; }
    .btn.danger { background: var(--errbg); color: var(--err); }

    /* ---------- bottom bar ---------- */

    .bottom {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 25;
      background: #fff; border-top: 1px solid var(--line);
      padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
      box-shadow: 0 -2px 10px rgba(0,0,0,.05);
    }
    .bottom-in { max-width: 760px; margin: auto; display: flex; gap: 10px; align-items: center; }
    .bottom .info { font-size: 12.5px; color: var(--muted); line-height: 1.25; min-width: 0; flex: 1; }
    .bottom .info b { color: var(--ink); font-size: 15px; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .bottom .btn { flex: none; min-width: 46%; }
    .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #f59e0b; margin-right: 4px; vertical-align: middle; }

    /* ---------- group sheet (registration) ---------- */

    .sheet {
      position: fixed; inset: 0; z-index: 40; background: var(--bg);
      display: none; flex-direction: column;
    }
    .sheet.open { display: flex; }
    .sh-top { background: var(--ink); color: #fff; padding: 10px 12px; }
    .sh-top-in { max-width: 760px; margin: auto; display: flex; align-items: center; gap: 10px; }
    .sh-x { background: #374151; border: none; color: #fff; border-radius: 8px; padding: 8px 10px; font-size: 13px; cursor: pointer; flex: none; }
    .sh-title { flex: 1; min-width: 0; }
    .sh-title b { display: block; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .sh-title span { font-size: 12px; color: #d1d5db; }
    .sh-n { display: flex; align-items: center; gap: 4px; flex: none; font-size: 11px; color: #d1d5db; }
    .sh-n .step { border-color: #4b5563; }
    .sh-n .step button { background: #374151; color: #fff; width: 30px; height: 32px; }
    .sh-n .step input { width: 34px; height: 32px; background: #1f2937; color: #fff; }

    .units { display: flex; gap: 6px; overflow-x: auto; padding: 10px 12px 2px; max-width: 760px; margin: 0 auto; width: 100%; scrollbar-width: none; }
    .units::-webkit-scrollbar { display: none; }
    .u {
      flex: none; border: 1.5px solid #d1d5db; background: #fff; border-radius: 999px;
      padding: 7px 12px; font-size: 13px; font-weight: bold; cursor: pointer;
    }
    .u.cur { border-color: var(--ink); background: var(--ink); color: #fff; }
    .u.ok { border-color: var(--ok); color: var(--ok); }
    .u.cur.ok { background: var(--ok); color: #fff; }
    .u.saved { border-color: var(--ok); background: var(--okbg); color: var(--ok); }

    .sh-body { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }
    .sh-body .wrap { padding-bottom: 20px; }
    .sh-foot { background: #fff; border-top: 1px solid var(--line); padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); }
    .sh-foot-in { max-width: 760px; margin: auto; display: flex; gap: 10px; }
    .sh-foot .btn { flex: 1; }
    .sh-foot .btn.sec { flex: 0 0 34%; }

    .card { background: #fff; border-radius: 12px; padding: 12px; margin-bottom: 10px; box-shadow: 0 1px 4px rgba(0,0,0,.06); }
    .f { margin-bottom: 12px; }
    .f:last-child { margin-bottom: 0; }
    .lbl { display: block; font-size: 13px; font-weight: bold; margin-bottom: 6px; }
    .hint { font-weight: normal; color: var(--muted); font-size: 12px; }
    .f.err > .lbl { color: var(--err); }
    .f.err input, .f.err select { border-color: var(--err); background: #fff7f7; }
    .f.err .chip { border-color: #fca5a5; }
    .f.err .ph { border-color: var(--err); }

    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip {
      min-height: 40px; padding: 8px 12px; border: 1.5px solid #d1d5db; border-radius: 999px;
      background: #fff; font-size: 13.5px; cursor: pointer;
    }
    .chip.on { background: var(--ink); border-color: var(--ink); color: #fff; }
    .chips.g2 { display: grid; grid-template-columns: 1fr 1fr; }
    .chips.g2 .chip { border-radius: 10px; }
    .other { margin-top: 6px; }

    .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .two .f { margin-bottom: 0; }
    .spec-nums { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
    .spec-nums .f { margin-bottom: 0; }

    .bc { display: flex; gap: 6px; }
    .bc input { font-family: "Courier New", monospace; font-weight: bold; letter-spacing: .03em; }
    .bc .btn { flex: none; padding: 9px 12px; font-size: 14px; }
    .chk { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); margin-top: 8px; cursor: pointer; }
    .chk input { width: 18px; height: 18px; }
    .msg { font-size: 12.5px; margin-top: 6px; }
    .msg.ok { color: var(--ok); } .msg.bad { color: var(--err); } .msg.wait { color: var(--info); }

    .phs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
    .ph {
      position: relative; border: 2px dashed #d1d5db; border-radius: 10px; background: var(--soft);
      aspect-ratio: 1 / 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center; font-size: 10.5px; line-height: 1.15; padding: 4px; cursor: pointer; overflow: hidden; color: var(--muted);
    }
    .ph .ic { font-size: 20px; margin-bottom: 3px; }
    .ph.has { border-style: solid; border-color: var(--ok); padding: 0; }
    .ph img { width: 100%; height: 100%; object-fit: cover; }
    .ph .tag { position: absolute; left: 0; right: 0; bottom: 0; background: rgba(17,24,39,.72); color: #fff; font-size: 10.5px; padding: 3px; }
    .ph input { display: none; }
    .ph .rq { color: #dc2626; }

    .stepper { display: inline-flex; align-items: center; border: 1px solid #d1d5db; border-radius: 10px; overflow: hidden; }
    .stepper button { width: 42px; height: 40px; border: none; background: var(--bg); font-size: 20px; cursor: pointer; }
    .stepper input { width: 52px; border: none; border-radius: 0; text-align: center; font-weight: bold; padding: 0; height: 40px; }

    details.more { background: #fff; border-radius: 12px; padding: 0 12px; margin-bottom: 10px; box-shadow: 0 1px 4px rgba(0,0,0,.06); }
    details.more summary { padding: 13px 0; font-size: 13.5px; font-weight: bold; cursor: pointer; list-style: none; }
    details.more summary::after { content: '＋'; float: right; color: var(--muted); }
    details.more[open] summary::after { content: '－'; }
    details.more .in { padding-bottom: 12px; }

    .note { background: var(--warnbg); color: var(--warn); font-size: 12.5px; padding: 9px 11px; border-radius: 8px; margin-bottom: 10px; line-height: 1.4; }
    .copied { background: var(--infobg); color: var(--info); font-size: 12.5px; padding: 8px 11px; border-radius: 8px; margin-bottom: 10px; }
    .errbox { background: var(--errbg); color: var(--err); font-size: 13px; padding: 10px 12px; border-radius: 8px; margin-bottom: 10px; line-height: 1.4; display: none; }

    /* ---------- dialog + toast ---------- */

    .modal { position: fixed; inset: 0; z-index: 60; background: rgba(17,24,39,.55); display: none; align-items: flex-end; justify-content: center; }
    .modal.open { display: flex; }
    .dlg { background: #fff; width: 100%; max-width: 520px; border-radius: 16px 16px 0 0; padding: 18px 16px calc(16px + env(safe-area-inset-bottom)); }
    .dlg h4 { margin: 0 0 8px; font-size: 17px; }
    .dlg p { margin: 0 0 14px; font-size: 14px; line-height: 1.5; color: var(--text); }
    .dlg .btns { display: grid; gap: 8px; }
    .ids { margin: 0 0 14px; }
    .aid { display: inline-block; font-family: "Courier New", monospace; font-weight: bold; background: var(--bg); padding: 3px 7px; border-radius: 5px; margin: 3px 4px 0 0; font-size: 13px; }

    .toast {
      position: fixed; left: 50%; bottom: 92px; transform: translateX(-50%) translateY(20px);
      background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 10px; font-size: 13.5px;
      opacity: 0; pointer-events: none; transition: all .25s; z-index: 70; max-width: 90%; text-align: center;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    .hide { display: none !important; }

  </style>

</head>

<body>


<!-- =========================================
     TOP: title + tabs
========================================= -->

<div class="top">
  <div class="top-row">
    <h1>Kitchen Asset Register</h1>
    <div class="sub" id="topSub">Select outlet to start</div>
  </div>
  <div class="tabs">
    <button type="button" class="tab on" id="tabCount" onclick="showTab('count')">① Count <span class="pill" id="pillCount">0</span></button>
    <button type="button" class="tab" id="tabReg" onclick="showTab('reg')">② Register <span class="pill" id="pillReg">0/0</span></button>
  </div>
</div>


<div class="wrap">

  <!-- OUTLET | NAME | MOBILE  (one row) -->

  <div class="who">
    <label id="wOutlet"><span class="k">Outlet <span class="req">*</span></span>
      <select id="outlet"><option value="">Select</option></select></label>
    <label id="wName"><span class="k">Name <span class="req">*</span></span>
      <input id="name" type="text" placeholder="Your name" autocomplete="name"></label>
    <label id="wMobile"><span class="k">Mobile</span>
      <input id="mobile" type="tel" inputmode="numeric" maxlength="10" placeholder="Optional"></label>
  </div>


  <!-- STEP 1: COUNT -->

  <div id="countView">
    <div class="jump" id="jump"></div>
    <div id="countGroups"></div>
  </div>


  <!-- STEP 2: REGISTER -->

  <div id="regView" class="hide">
    <div id="resume"></div>
    <div id="regBody"></div>
  </div>

</div>


<!-- =========================================
     BOTTOM BAR
========================================= -->

<div class="bottom">
  <div class="bottom-in">
    <div class="info" id="bInfo"></div>
    <button type="button" class="btn" id="bBtn"></button>
  </div>
</div>


<!-- =========================================
     REGISTRATION SHEET (all units of one item)
========================================= -->

<div class="sheet" id="sheet">

  <div class="sh-top">
    <div class="sh-top-in">
      <button type="button" class="sh-x" onclick="pauseGroup()">⏸ Pause</button>
      <div class="sh-title"><b id="shTitle"></b><span id="shSub"></span></div>
      <div class="sh-n">Units
        <div class="step">
          <button type="button" onclick="changeUnits(-1)">−</button>
          <input id="shN" type="number" readonly>
          <button type="button" onclick="changeUnits(1)">+</button>
        </div>
      </div>
    </div>
  </div>

  <div class="units" id="units"></div>

  <div class="sh-body" id="shBody"><div class="wrap" id="unitForm"></div></div>

  <div class="sh-foot">
    <div class="sh-foot-in">
      <button type="button" class="btn sec" id="fPrev" onclick="goUnit(G.cur - 1)">← Back</button>
      <button type="button" class="btn" id="fNext" onclick="nextOrSubmit()"></button>
    </div>
  </div>

</div>


<!-- dialog + toast -->

<div class="modal" id="modal"><div class="dlg" id="dlg"></div></div>
<div class="toast" id="toast"></div>

<input type="file" id="scanInput" accept="image/*" capture="environment" style="display:none">

/* =========================================
   SMALL HELPERS
========================================= */

function $(id) { return document.getElementById(id); }

function el(tag, cls, html) {
  var e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html !== undefined && html !== null) e.innerHTML = html;
  return e;
}

function esc(s) {
  return String(s === undefined || s === null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

function isEmpty(v) {
  if (v === undefined || v === null) return true;
  if (Array.isArray(v)) return v.length === 0;
  return String(v).trim() === '';
}

function nameOf(it) { return it.short || it.name; }

function n(v) { return parseInt(v, 10) || 0; }

function uid() {
  return Date.now().toString(36).toUpperCase() + Math.random().toString(36).slice(2, 7).toUpperCase();
}

var store = {
  get: function (k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } },
  set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
  del: function (k) { try { localStorage.removeItem(k); } catch (e) {} }
};

function callServer(action, data) {
  if (!APP.API_URL) return LocalAPI.call(action, data);
  return fetch(APP.API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },   // no CORS pre-flight
    body: JSON.stringify({ action: action, data: data, key: APP.API_KEY || '' })
  }).then(function (r) {
    if (!r.ok) throw new Error('Server error ' + r.status);
    return r.json();
  });
}

/* units already accounted for = here now + away for repair */
function have(code) { return n(S.registered[code]) + n(S.away[code]); }


/* =========================================
   PHONE-ONLY MODE
   When API_URL is empty the app still works fully: counts and
   registrations are kept on this phone (IndexedDB) in an "outbox".
   As soon as API_URL is set, the outbox is sent to the Google Sheet
   automatically (each unit has a unique id, so nothing is sent twice).
========================================= */

var LDB = (function () {
  var p = null, mem = {};
  function open() {
    if (p) return p;
    p = new Promise(function (res) {
      try {
        var r = indexedDB.open('kap_local', 1);
        r.onupgradeneeded = function () { r.result.createObjectStore('kv'); };
        r.onsuccess = function () { res(r.result); };
        r.onerror = function () { res(null); };
      } catch (e) { res(null); }
    });
    return p;
  }
  function req(mode, fn) {
    return open().then(function (db) {
      if (!db) return undefined;
      return new Promise(function (res) {
        try {
          var q = fn(db.transaction('kv', mode).objectStore('kv'));
          q.onsuccess = function () { res(q.result); };
          q.onerror = function () { res(undefined); };
        } catch (e) { res(undefined); }
      });
    });
  }
  return {
    get: function (k) { return req('readonly', function (st) { return st.get(k); }).then(function (v) { return v === undefined ? mem[k] : v; }); },
    put: function (k, v) { mem[k] = v; return req('readwrite', function (st) { return st.put(v, k); }); },
    del: function (k) { delete mem[k]; return req('readwrite', function (st) { return st.delete(k); }); },
    keys: function (prefix) {
      return open().then(function (db) {
        if (!db) return Object.keys(mem).filter(function (k) { return k.indexOf(prefix) === 0; }).sort();
        return new Promise(function (res) {
          try {
            var q = db.transaction('kv', 'readonly').objectStore('kv').getAllKeys();
            q.onsuccess = function () { res(q.result.filter(function (k) { return String(k).indexOf(prefix) === 0; }).sort()); };
            q.onerror = function () { res([]); };
          } catch (e) { res([]); }
        });
      });
    }
  };
})();

function localMeta() {
  return LDB.get('meta').then(function (m) { return m || { counts: {}, assets: [] }; });
}

function outboxKey() { return 'ob:' + Date.now() + ':' + uid(); }

      return { success: true, counts: m.counts[outlet] || {}, registered: reg, away: {}, lastUpdate: null };
    });
  },

  saveCounts: function (d) {
    return localMeta().then(function (m) {
      m.counts[d.outlet] = Object.assign(m.counts[d.outlet] || {}, d.counts);
      return LDB.put('meta', m);
    }).then(function () {
      return LDB.put(outboxKey(), { type: 'saveCounts', data: d });
    }).then(function () { return { success: true, local: true }; });
  },

  checkBarcodes: function (list) {
    return localMeta().then(function (m) {
      var dup = [];
      m.assets.forEach(function (a) {
        if (a.barcode && list.indexOf(a.barcode) > -1) dup.push({ barcode: a.barcode, assetId: a.localId, outlet: a.outlet });
      });
      return { success: true, duplicates: dup };
    });
  },

  saveAsset: function (a) {
    return localMeta().then(function (m) {
      var same = m.assets.filter(function (x) { return x.uid === a.uid; })[0];
      if (same) return { success: true, id: same.localId, local: true };
      var bc = String(a.barcode || '').trim().toUpperCase();
      if (bc && m.assets.some(function (x) { return x.barcode === bc; })) {
        return { success: false, message: 'Barcode ' + bc + ' is already used on this phone.' };
      }
      var num = m.assets.filter(function (x) { return x.itemId === a.itemId; }).length + 1;
      var localId = a.itemId + '-P' + String(num).padStart(3, '0');
      m.assets.push({ uid: a.uid, outlet: a.outlet, itemId: a.itemId, barcode: bc, localId: localId, at: Date.now() });
      return LDB.put(outboxKey(), { type: 'saveAsset', data: a })
        .then(function () { return LDB.put('meta', m); })
        .then(function () { return { success: true, id: localId, local: true }; });
    });
  }

};

/* send the phone's outbox to the sheet (runs when API_URL is set) */
var syncing = false;
function syncOutbox() {
  if (syncing || !APP.API_URL) return Promise.resolve();
  syncing = true;
  var sent = 0, failed = 0;
  return LDB.keys('ob:').then(function (keys) {
    return keys.reduce(function (chain, k) {
      return chain.then(function () {
        return LDB.get(k).then(function (item) {
          if (!item) return;
          return callServer(item.type, item.data).then(function (r) {
            if (r && r.success) { sent++; return LDB.del(k); }
            failed++;
            item.error = (r && r.message) || 'error';
            return LDB.put(k, item);
          }).catch(function () { failed++; });
        });
      });
    }, Promise.resolve());
  }).then(function () {
    syncing = false;
    if (sent && !failed) LDB.put('meta', { counts: {}, assets: [] });
    if (sent) {
      toast('✓ ' + sent + ' saved entr' + (sent > 1 ? 'ies' : 'y') + ' sent to the sheet');
      if (S.outlet) loadOutlet();
    }
    if (failed) setTimeout(function () { toast(failed + ' saved entr' + (failed > 1 ? 'ies' : 'y') + ' not sent yet – will retry'); }, 2800);
  });
}

/* =========================================
   DRAFT STORAGE (on this phone — IndexedDB,
   big enough for photos; memory fallback)
========================================= */

var DB = (function () {

  var mem = {};
  var dbp = null;

  function open() {
    if (dbp) return dbp;
    dbp = new Promise(function (res) {
      try {
        var r = indexedDB.open('kap_v3', 1);
        r.onupgradeneeded = function () { r.result.createObjectStore('drafts'); };
        r.onsuccess = function () { res(r.result); };
        r.onerror = function () { res(null); };
      } catch (e) { res(null); }
    });
    return dbp;
  }

  function run(mode, fn) {
    return open().then(function (db) {
      if (!db) return fn(null);
      return new Promise(function (res) {
        try {
          var st = db.transaction('drafts', mode).objectStore('drafts');
          var req = fn(st);
          if (!req) return res(null);
          req.onsuccess = function () { res(req.result); };
          req.onerror = function () { res(null); };
        } catch (e) { res(null); }
      });
    });
  }

  return {
    put: function (k, v) { mem[k] = v; return run('readwrite', function (st) { return st ? st.put(v, k) : null; }); },
    del: function (k) { delete mem[k]; return run('readwrite', function (st) { return st ? st.delete(k) : null; }); },
    list: function (prefix) {
      return open().then(function (db) {
        if (!db) {
          return Object.keys(mem).filter(function (k) { return k.indexOf(prefix) === 0; })
            .map(function (k) { return mem[k]; });
        }
        return new Promise(function (res) {
          var out = [];
          try {
            var req = db.transaction('drafts', 'readonly').objectStore('drafts').openCursor();
            req.onsuccess = function () {
              var c = req.result;
              if (!c) return res(out);
              if (String(c.key).indexOf(prefix) === 0) out.push(c.value);
              c.continue();
            };
            req.onerror = function () { res(out); };
          } catch (e) { res(out); }
        });
      });
    }
  };

})();

function draftKey(outlet, itemId) { return outlet + '|' + itemId; }

var saveTimer;
function saveDraftSoon() {
  if (!G) return;
  G.updatedAt = Date.now();
  clearTimeout(saveTimer);
  var snapshot = G;
  saveTimer = setTimeout(function () { DB.put(draftKey(snapshot.outlet, snapshot.itemId), snapshot); }, 400);
}

function unitHasData(u) {
  return !!(u.savedId || u.barcode || u.brand || u.condition || Object.keys(u.photos || {}).length);
}

function draftHasData(d) {
  return d && d.units.some(unitHasData);
}


/* =========================================
   START
========================================= */

window.onload = function () {

  // Start immediately with the built-in item list (or the last one from the server).
  var cfg = BUILTIN_CONFIG;
  var cached = APP.API_URL ? store.get('kap_config_v1') : '';
  if (cached) { try { cfg = JSON.parse(cached); } catch (e) { /* ignore */ } }
  setConfig(cfg);
  start();

  if (!APP.API_URL) return;            // phone-only mode until the sheet is connected

  // refresh the item list from the server in the background
  fetch(APP.API_URL + '?action=config').then(function (r) { return r.json(); }).then(function (c) {
    if (!c || !c.success) return;
    var fresh = JSON.stringify(c);
    if (fresh !== store.get('kap_config_v1')) {
      store.set('kap_config_v1', fresh);
      setConfig(c); renderJump(); renderAll();
    }
  }).catch(function () { /* keep using the built-in list */ });

  // send anything that was saved on this phone before the sheet was connected
  syncOutbox();

};

function start() {

  var sel = $('outlet');
  function group(label, list) {
    var g = document.createElement('optgroup');
    g.label = label;
    list.forEach(function (o) {
      var op = document.createElement('option');

      g.appendChild(op);
    });

  }
  group('Outlets', CONFIG.outlets);
  if (CONFIG.locations && CONFIG.locations.length) group('Store', CONFIG.locations);

  // remembered on this phone

  $('name').value = store.get('kap_name');
  $('mobile').value = store.get('kap_mobile');

  S.mobile = $('mobile').value.trim();

  sel.onchange = function () {

    store.set('kap_name', S.name);
    $('wName').classList.remove('err');
  };

    this.value = this.value.replace(/\D/g, '').slice(0, 10);

  };

  $('scanInput').onchange = onScanFile;

  renderJump();

    if (countDirty()) { e.preventDefault(); e.returnValue = ''; }
  });

}


/* =========================================
   OUTLET LOAD
========================================= */

function loadOutlet() {

  S.outlet = $('outlet').value;
  S.saved = {}; S.registered = {}; S.away = {}; S.drafts = [];

  var local = S.outlet ? store.get('kap_counts_' + S.outlet) : '';
  S.counts = local ? JSON.parse(local) : {};

  $('topSub').textContent = S.outlet ? 'Outlet ' + S.outlet : 'Select outlet to start';
  if (!APP.API_URL && S.outlet) $('topSub').textContent = S.outlet + ' · saved on this phone';

  if (!S.outlet) { renderAll(); return; }

  S.loading = true;
  renderAll();

  var outlet = S.outlet;

  DB.list(outlet + '|').then(function (list) {
    if (S.outlet !== outlet) return;
    S.drafts = list.filter(draftHasData);
    renderAll();
  });

  callServer('getOutletStatus', outlet).then(function (r) {

    if (S.outlet !== outlet) return;
    S.loading = false;

    if (!r || !r.success) {
      toast('Could not load saved data. You can still continue.');
      renderAll();
      return;
    }

    S.saved = r.counts || {};
    S.registered = r.registered || {};
    S.away = r.away || {};

    // no unsaved local count → start from the saved one
    if (!local) S.counts = Object.assign({}, S.saved);

    // the count can never be lower than what is already registered (incl. away for repair)
    CONFIG.catalog.forEach(function (it) {
      if (n(S.counts[it.id]) < have(it.id)) S.counts[it.id] = have(it.id);
    });

    if (r.lastUpdate) $('topSub').textContent = S.outlet + ' · counted by ' + r.lastUpdate.by;

    renderAll();

    // counts already saved and nothing changed → open Register directly
    if (totals().saved > 0 && !countDirty() && S.tab === 'count') showTab('reg');

  }).catch(function () {
    if (S.outlet !== outlet) return;
    S.loading = false;
    toast('Network problem. Counts are kept on this phone.');
    renderAll();
  });

}

function checkWho() {
  var ok = true;
  if (!S.outlet) { $('wOutlet').classList.add('err'); ok = false; }
  if (!S.name) { $('wName').classList.add('err'); ok = false; }
  if (S.mobile && S.mobile.length !== 10) { $('wMobile').classList.add('err'); ok = false; }
  if (!ok) {
    window.scrollTo({ top: 0, behavior: 'smooth' });
    toast(!S.outlet ? 'Select the outlet first' : !S.name ? 'Enter your name first' : 'Mobile must be 10 digits');
  }
  return ok;
}


/* =========================================
   TABS + BOTTOM BAR
========================================= */

function showTab(t) {
  S.tab = t;
  $('tabCount').classList.toggle('on', t === 'count');
  $('tabReg').classList.toggle('on', t === 'reg');
  $('countView').classList.toggle('hide', t !== 'count');
  $('regView').classList.toggle('hide', t !== 'reg');
  renderBottom();
  window.scrollTo({ top: 0 });
}

function renderAll() {
  renderCount();
  renderReg();
  renderBottom();
}

function totals() {
  var counted = 0, saved = 0, reg = 0;
  CONFIG.catalog.forEach(function (it) {
    counted += n(S.counts[it.id]);
    saved += n(S.saved[it.id]);
    reg += Math.min(have(it.id), n(S.saved[it.id]) || have(it.id));
  });
  return { counted: counted, saved: saved, reg: reg };
}

function countDirty() {
  return CONFIG.catalog.some(function (it) { return n(S.counts[it.id]) !== n(S.saved[it.id]); });
}

function nextPending() {
  for (var i = 0; i < CONFIG.catalog.length; i++) {
    var it = CONFIG.catalog[i];
    if (n(S.saved[it.id]) > have(it.id)) return it;
  }
  return null;
}

function renderBottom() {

  var t = totals();
  $('pillCount').textContent = t.counted;
  $('pillReg').textContent = t.reg + '/' + t.saved;

  var info = $('bInfo'), btn = $('bBtn');
  btn.disabled = false;

  if (S.tab === 'count') {

    var dirty = countDirty();
    info.innerHTML = '<b>' + t.counted + ' items counted</b>' +
      (dirty ? '<span class="dot"></span>Not saved yet' : (t.saved ? '✓ Saved' : 'Tap + on each item'));
    btn.textContent = dirty || !t.saved ? 'Save Count →' : 'Go to Register →';
    btn.onclick = dirty || !t.saved ? saveCount : function () { showTab('reg'); };
    btn.disabled = S.loading || (!t.counted && !t.saved);
    return;

  }

  var paused = S.drafts[0];
  var next = nextPending();

  if (paused) {
    var pit = ITEMS[paused.itemId];
    info.innerHTML = '<b>' + esc(nameOf(pit)) + '</b>Paused – ' + filledCount(paused) + ' of ' + paused.units.length + ' filled';
    btn.textContent = 'Continue →';
    btn.onclick = function () { openDraft(paused); };
  } else if (next) {
    var left = n(S.saved[next.id]) - have(next.id);
    info.innerHTML = '<b>Next: ' + esc(nameOf(next)) + '</b>' + left + ' unit' + (left > 1 ? 's' : '') + ' to register';
    btn.textContent = 'Start →';
    btn.onclick = function () { openItem(next.id); };
  } else if (t.saved) {
    info.innerHTML = '<b>All registered ✓</b>' + t.reg + ' of ' + t.saved + ' done';
    btn.textContent = 'Edit Count';
    btn.onclick = function () { showTab('count'); };
  } else {
    info.innerHTML = '<b>Nothing to register</b>Save the count first';
    btn.textContent = '← Count';
    btn.onclick = function () { showTab('count'); };
  }

}


/* =========================================
   STEP 1 — COUNT
========================================= */

function renderJump() {
  var j = $('jump');
  j.innerHTML = '';
  CONFIG.groups.forEach(function (g, i) {
    var b = el('button', '', esc(g));
    b.type = 'button';
    b.dataset.g = g;
    b.onclick = function () { $('grp' + i).scrollIntoView({ behavior: 'smooth' }); };
    j.appendChild(b);
  });
}

function renderCount() {

  var wrap = $('countGroups');
  wrap.innerHTML = '';

  CONFIG.groups.forEach(function (g, gi) {

    var items = CONFIG.catalog.filter(function (i) { return i.group === g; });
    var sum = items.reduce(function (a, it) { return a + n(S.counts[it.id]); }, 0);

    // update jump chip with the group total
    var chip = document.querySelector('.jump button[data-g="' + g.replace(/"/g, '\\"') + '"]');
    if (chip) chip.innerHTML = esc(g) + (sum ? ' <b>' + sum + '</b>' : '');

    var sec = el('div', 'grp');
    sec.id = 'grp' + gi;
    sec.appendChild(el('h3', '', '<span>' + esc(g) + '</span><span>' + (sum ? sum + ' items' : '') + '</span>'));

    var grid = el('div', 'grid');
    items.forEach(function (it) { grid.appendChild(countCard(it)); });
    sec.appendChild(grid);
    wrap.appendChild(sec);

  });

}

function countCard(it) {

  var v = n(S.counts[it.id]);
  var reg = have(it.id);

  var c = el('div', 'cc' + (v ? ' on' : ''));
  c.innerHTML =
    (reg ? '<span class="creg">✓' + reg + '</span>' : '') +
    '<div class="cimg">' + imgHtml(it) + '</div>' +
    '<div class="cname">' + esc(nameOf(it)) + '</div>';

  var st = el('div', 'step');
  var minus = el('button', '', '−'); minus.type = 'button';
  var input = document.createElement('input');
  input.type = 'number'; input.inputMode = 'numeric'; input.min = String(reg);
  input.value = v ? String(v) : '0';
  var plus = el('button', '', '+'); plus.type = 'button';

  function set(x, fromTyping) {
    x = Math.max(reg, Math.min(999, x));
    if (x < reg && !fromTyping) toast(reg + ' already registered – cannot go lower');
    S.counts[it.id] = x;
    if (!fromTyping) input.value = String(x);
    c.classList.toggle('on', x > 0);
    store.set('kap_counts_' + S.outlet, JSON.stringify(S.counts));
    updateGroupTotals();
    renderBottom();
  }

  minus.onclick = function () {
    if (n(input.value) <= reg && reg) { toast(reg + ' already registered – cannot go lower'); return; }
    set(n(input.value) - 1);
  };
  plus.onclick = function () {
    if (!S.outlet) { checkWho(); return; }
    set(n(input.value) + 1);
  };
  input.onfocus = function () { input.select(); };
  input.oninput = function () { set(n(input.value), true); };
  input.onblur = function () { input.value = String(Math.max(reg, n(input.value))); set(n(input.value)); };

  st.appendChild(minus); st.appendChild(input); st.appendChild(plus);
  c.appendChild(st);

  if (it.note) c.appendChild(el('div', 'cnote', esc(it.note)));

  return c;

}

function updateGroupTotals() {
  CONFIG.groups.forEach(function (g, gi) {
    var sum = CONFIG.catalog.filter(function (i) { return i.group === g; })
      .reduce(function (a, it) { return a + n(S.counts[it.id]); }, 0);
    var chip = document.querySelector('.jump button[data-g="' + g.replace(/"/g, '\\"') + '"]');
    if (chip) chip.innerHTML = esc(g) + (sum ? ' <b>' + sum + '</b>' : '');
    var h = document.querySelector('#grp' + gi + ' h3 span:last-child');
    if (h) h.textContent = sum ? sum + ' items' : '';
  });
}

async function saveCount() {

  if (!checkWho()) return;

  var changed = {};
  CONFIG.catalog.forEach(function (it) {
    if (n(S.counts[it.id]) !== n(S.saved[it.id])) changed[it.id] = n(S.counts[it.id]);
  });

  var t = totals();
  if (!t.counted) { toast('Tap + on the items you have'); return; }

  var btn = $('bBtn');
  btn.disabled = true;
  btn.textContent = 'Saving…';

  try {
    var r = await callServer('saveCounts', {
      outlet: S.outlet, collectedBy: S.name, mobile: S.mobile, counts: changed
    });
    if (!r || !r.success) throw new Error((r && r.message) || 'Unable to save.');
    Object.keys(changed).forEach(function (c) { S.saved[c] = changed[c]; });
    store.del('kap_counts_' + S.outlet);
    toast('✓ Count saved');
    renderAll();
    showTab('reg');
  } catch (e) {
    toast('Not saved: ' + (e.message || e) + ' — try again');
    renderBottom();
  }

}


/* =========================================
   STEP 2 — REGISTER LIST
========================================= */

function filledCount(d) {
  var it = ITEMS[d.itemId];

}

function renderReg() {

  // resume banner
  var res = $('resume');
  res.innerHTML = '';
  if (S.drafts.length) {
    var d = S.drafts[0];
    var it = ITEMS[d.itemId];
    var b = el('div', 'banner',

        (away ? ' · <b style="display:inline;font-size:12px;color:#92400e">' + away + ' at repair</b>' : '') + '</span></div>' + st);
      row.type = 'button';

      list.appendChild(row);

    });

    body.appendChild(list);

  });

}


/* =========================================
   OPEN A GROUP (one item, all its units)
========================================= */

function newUnit() {
  return { uid: uid(), barcode: '', noSticker: false, brand: '', brandOther: false, model: '',
           specs: {}, condition: '', conditionOther: '', repairCount: 0, repairIssue: '',
           repairIssueOther: '', remarks: '', photos: {}, savedId: '' };
}

async function openItem(itemId) {

  if (!checkWho()) return;

  var it = ITEMS[itemId];

  // only one item at a time: finish the paused one first
  var other = S.drafts.filter(function (d) { return d.itemId !== itemId; })[0];
  if (other) {
    var oit = ITEMS[other.itemId];
    var r = await ask('Finish ' + nameOf(oit) + ' first',
      '<p>' + nameOf(oit) + ' is paused (' + filledCount(other) + ' of ' + other.units.length +
      ' filled). Register all its units before starting a new item.</p>',
      [{ t: 'Continue ' + nameOf(oit), v: 'go' },
       { t: 'Discard ' + nameOf(oit) + ' entries', v: 'drop', cls: 'danger' },
       { t: 'Cancel', v: '', cls: 'sec' }]);
    if (r === 'go') return openDraft(other);
    if (r !== 'drop') return;
    await DB.del(draftKey(other.outlet, other.itemId));
    S.drafts = S.drafts.filter(function (d) { return d !== other; });
    renderAll();
  }

  var mine = S.drafts.filter(function (d) { return d.itemId === itemId; })[0];
  if (mine) return openDraft(mine);

  var left = n(S.saved[itemId]) - have(itemId);

  if (left <= 0) {
    var more = await ask(nameOf(it) + ' – all registered',
      '<p>' + have(itemId) + ' of ' + n(S.saved[itemId]) + ' registered' +
      (n(S.away[itemId]) ? ' (' + n(S.away[itemId]) + ' away for repair)' : '') + '. Found more at this outlet?</p>',
      [{ t: '+ Register 1 more', v: 'more' }, { t: 'Close', v: '', cls: 'sec' }]);
    if (!more) return;
    left = 1;
  }

  var units = [];
  for (var i = 0; i < left; i++) units.push(newUnit());

  openDraft({
    outlet: S.outlet, itemId: itemId, groupId: uid(), units: units, cur: 0,
    startCount: n(S.saved[itemId]), createdAt: Date.now(), updatedAt: Date.now()
  });

}

function openDraft(d) {
  G = d;
  G.showErr = {};
  if (G.cur >= G.units.length) G.cur = 0;
  var it = ITEMS[G.itemId];
  $('shTitle').textContent = nameOf(it);
  $('sheet').classList.add('open');
  document.body.style.overflow = 'hidden';
  renderSheet();
}

async function pauseGroup() {

  if (!G) return;
  clearTimeout(saveTimer);

  if (draftHasData(G)) {
    await DB.put(draftKey(G.outlet, G.itemId), G);
    if (S.drafts.indexOf(G) < 0) {
      S.drafts = S.drafts.filter(function (d) { return d.itemId !== G.itemId; });
      S.drafts.unshift(G);
    }
    toast('⏸ Saved on this phone – continue anytime');
  } else {
    await DB.del(draftKey(G.outlet, G.itemId));
    S.drafts = S.drafts.filter(function (d) { return d.itemId !== G.itemId; });
  }

  closeSheet();

}

function closeSheet() {
  $('sheet').classList.remove('open');
  document.body.style.overflow = '';
  G = null;
  renderAll();
}

async function changeUnits(delta) {

  if (!G) return;

  if (delta > 0) {
    G.units.push(newUnit());
    G.cur = G.units.length - 1;
    toast('Unit ' + G.units.length + ' added');
  } else {
    if (G.units.length <= 1) { toast('At least 1 unit. Use Pause to stop.'); return; }
    var last = G.units[G.units.length - 1];
    if (last.savedId) { toast('That unit is already saved'); return; }
    if (unitHasData(last)) {
      var r = await ask('Remove unit ' + G.units.length + '?', '<p>Details entered for this unit will be lost.</p>',
        [{ t: 'Remove', v: 'y', cls: 'danger' }, { t: 'Keep', v: '', cls: 'sec' }]);
      if (!r) return;
    }
    G.units.pop();
    if (G.cur >= G.units.length) G.cur = G.units.length - 1;
  }

  saveDraftSoon();
  renderSheet();

}


/* =========================================
   SHEET RENDER
========================================= */

function missing(u, it) {

  var m = [];
  if (CONFIG.barcodeRequired && !u.noSticker && isEmpty(u.barcode)) m.push('barcode');
  if (it.kind === 'equipment' && isEmpty(u.brand)) m.push('brand');
  if (isEmpty(u.condition)) m.push('condition');
  it.specs.forEach(function (s) { if (s.required && isEmpty(u.specs[s.key])) m.push('spec:' + s.key); });
  it.photos.forEach(function (p) {
    if (p.required && !(u.photos[p.key] && u.photos[p.key].data)) m.push('photo:' + p.key);
  });
  return m;

}

function renderSheet() {

  var it = ITEMS[G.itemId];
  var reg = have(G.itemId);

  $('shN').value = G.units.length;
  $('shSub').textContent = reg ? reg + ' already registered · fill all ' + G.units.length + ' below'
                               : 'Fill all ' + G.units.length + ' unit' + (G.units.length > 1 ? 's' : '') + ', then submit';

  // unit pills
  var pills = $('units');
  pills.innerHTML = '';
  G.units.forEach(function (u, i) {
    var done = u.savedId || !missing(u, it).length;
    var p = el('button', 'u' + (i === G.cur ? ' cur' : '') + (u.savedId ? ' saved' : done ? ' ok' : ''),
      'Unit ' + (i + 1) + (u.savedId ? ' ✓' : done ? ' ✓' : ''));
    p.type = 'button';
    p.onclick = function () { goUnit(i); };
    pills.appendChild(p);
  });

  // auto-copy brand & details from the previous unit (saves typing)
  var u = G.units[G.cur];
  var prev = G.units[G.cur - 1];
  var copiedNow = false;
  if (prev && !u.touched && !u.brand && !Object.keys(u.specs).length) {
    u.brand = prev.brand; u.brandOther = prev.brandOther; u.model = '';
    u.specs = JSON.parse(JSON.stringify(prev.specs || {}));
    copiedNow = !!(u.brand || Object.keys(u.specs).length);
    u.touched = true;
  }

  renderUnitForm(it, u, copiedNow);

  // footer
  var last = G.cur === G.units.length - 1;
  $('fPrev').classList.toggle('hide', G.cur === 0);
  var nb = $('fNext');
  nb.disabled = false;
  if (last) {
    var left = G.units.filter(function (x) { return !x.savedId; }).length;
    nb.textContent = 'Submit all ' + left + ' ✓';
  } else {
    nb.textContent = 'Next: Unit ' + (G.cur + 2) + ' →';
  }

  $('shBody').scrollTop = 0;
  pills.children[G.cur] && pills.children[G.cur].scrollIntoView({ inline: 'center', block: 'nearest' });

}

function goUnit(i) {
  if (!G || i < 0 || i >= G.units.length) return;
  G.cur = i;
  renderSheet();
}

function nextOrSubmit() {

  var it = ITEMS[G.itemId];
  var u = G.units[G.cur];

  if (!u.savedId && missing(u, it).length) {
    G.showErr[G.cur] = true;
    renderSheet();
    var firstErr = document.querySelector('#unitForm .f.err');
    if (firstErr) firstErr.scrollIntoView({ behavior: 'smooth', block: 'center' });
    toast('Fill the fields marked in red');
    return;
  }

  if (G.cur < G.units.length - 1) { goUnit(G.cur + 1); return; }

  submitGroup();

}

function fld(key, label, req, hint) {
  var f = el('div', 'f');

    (hint ? ' <span class="hint">' + esc(hint) + '</span>' : '')));

}

function chipsEl(options, value, onPick, multi, grid) {
  var box = el('div', 'chips' + (grid ? ' g2' : ''));
  options.forEach(function (o) {
    var on = multi ? (value || []).indexOf(o) > -1 : value === o;
    var c = el('button', 'chip' + (on ? ' on' : ''), esc(o));
    c.type = 'button';
    c.onclick = function () {
      if (multi) {
        c.classList.toggle('on');
        onPick(Array.prototype.map.call(box.querySelectorAll('.chip.on'), function (x) { return x.textContent; }));
      } else {
        var was = c.classList.contains('on');
        box.querySelectorAll('.chip').forEach(function (x) { x.classList.remove('on'); });
        if (!was) c.classList.add('on');
        onPick(was ? '' : o);
      }
    };
    box.appendChild(c);
  });
  return box;
}

function inputEl(value, onInput, opts) {
  opts = opts || {};
  var i = document.createElement('input');
  i.type = opts.type || 'text';
  if (opts.type === 'number') { i.inputMode = 'decimal'; i.min = '0'; }
  i.placeholder = opts.placeholder || '';
  i.value = value === undefined || value === null ? '' : value;
  i.oninput = function () { onInput(i.value); };
  return i;
}

function changed() {
  var u = G.units[G.cur];
  u.touched = true;

function refreshPills() {
  var it = ITEMS[G.itemId];
  var pills = $('units').children;
  G.units.forEach(function (u, i) {
    var done = u.savedId || !missing(u, it).length;

  /* ---- more details (optional, folded) ---- */

/* =========================================
   PHOTO TILE (auto-compressed)
========================================= */

function photoTile(u, p, wrap) {

  var t = el('label', 'ph');
  var input = document.createElement('input');
  input.type = 'file'; input.accept = 'image/*';
  input.setAttribute('capture', 'environment');

  function paint() {
    var ph = u.photos[p.key];
    t.className = 'ph' + (ph && ph.data ? ' has' : '');
    t.innerHTML = '';
    if (ph && ph.data) {
      t.appendChild(el('img', '')).src = 'data:' + (ph.mimeType || 'image/jpeg') + ';base64,' + ph.data;
      t.appendChild(el('span', 'tag', esc(p.label) + ' · retake'));
    } else {
      t.innerHTML = '<span class="ic">📷</span>' + esc(p.label) + (p.required ? ' <span class="rq">*</span>' : '');
    }
    t.appendChild(input);
  }

  input.onchange = function () {
    if (!input.files || !input.files.length) return;
    var file = input.files[0];
    t.innerHTML = '<span class="ic">⏳</span>Preparing…';
    t.appendChild(input);
    compressImage(file).then(function (r) {
      if (r) { u.photos[p.key] = r; wrap.classList.remove('err'); changed(); }
      else toast('Could not read that photo. Please retake.');
      paint();
    });
  };

  paint();
  return t;

}

/* Resize to max 1280px JPEG (~150–300 KB instead of 3–6 MB). */
function compressImage(file, max, quality) {

  max = max || 1280; quality = quality || 0.72;

  return new Promise(function (resolve) {

    function fallback() {
      var reader = new FileReader();
      reader.onload = function (e) { resolve({ data: e.target.result.split(',')[1], mimeType: file.type || 'image/jpeg' }); };
      reader.onerror = function () { resolve(null); };
      reader.readAsDataURL(file);
    }

    try {
      var url = URL.createObjectURL(file);
      var img = new Image();
      img.onload = function () {
        try {
          var w = img.naturalWidth, h = img.naturalHeight;
          var scale = Math.min(1, max / Math.max(w, h));
          var canvas = document.createElement('canvas');
          canvas.width = Math.round(w * scale);
          canvas.height = Math.round(h * scale);
          canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
          var dataUrl = canvas.toDataURL('image/jpeg', quality);
          URL.revokeObjectURL(url);
          resolve({ data: dataUrl.split(',')[1], mimeType: 'image/jpeg' });
        } catch (e) { fallback(); }
      };
      img.onerror = function () { fallback(); };
      img.src = url;
    } catch (e) { fallback(); }

  });

}


/* =========================================
   BARCODE SCAN (photo → decode)
   Uses the phone camera app, so it works inside Apps Script.
========================================= */

var zxingP = null;
function loadZXing() {
  if (window.ZXing) return Promise.resolve();
  if (zxingP) return zxingP;
  zxingP = new Promise(function (res, rej) {
    var s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js';
    s.onload = res;
    s.onerror = function () { zxingP = null; rej(new Error('Scanner could not load')); };
    document.head.appendChild(s);
  });
  return zxingP;
}

async function decodeBarcode(file) {

  var small = await compressImage(file, 1600, 0.9);
  if (!small) return null;
  var dataUrl = 'data:image/jpeg;base64,' + small.data;

  if ('BarcodeDetector' in window) {
    try {
      var img = new Image();
      await new Promise(function (r, j) { img.onload = r; img.onerror = j; img.src = dataUrl; });
      var found = await new BarcodeDetector().detect(img);
      if (found && found.length) return found[0].rawValue;
    } catch (e) { /* fall back to ZXing */ }
  }

  await loadZXing();
  var hints = new Map();
  hints.set(ZXing.DecodeHintType.TRY_HARDER, true);
  var reader = new ZXing.BrowserMultiFormatReader(hints);
  try {
    var res = await reader.decodeFromImageUrl(dataUrl);
    return res ? res.getText() : null;
  } catch (e) {
    return null;
  }

}

async function onScanFile() {

  var input = $('scanInput');
  if (!G || !input.files || !input.files.length) return;

  var u = G.units[G.cur];
  var msg = $('bcMsg');
  if (msg) { msg.className = 'msg wait'; msg.textContent = 'Reading barcode…'; }

  var code = null;
  try { code = await decodeBarcode(input.files[0]); } catch (e) { code = null; }

  if (!G || G.units[G.cur] !== u) return;

  if (!code) {
    if (msg) { msg.className = 'msg bad'; msg.textContent = 'Could not read it. Hold closer with good light, or type the number.'; }
    return;
  }

  code = String(code).trim().toUpperCase();

  var dupe = G.units.some(function (x) { return x !== u && x.barcode === code; });
  if (dupe) {
    if (msg) { msg.className = 'msg bad'; msg.textContent = code + ' is already used for another unit here.'; }
    return;
  }

  u.barcode = code;
  changed();
  renderUnitForm(ITEMS[G.itemId], u, false);
  var m2 = $('bcMsg');
  if (m2) { m2.className = 'msg ok'; m2.textContent = '✓ Scanned ' + code; }

}


/* =========================================
   SUBMIT GROUP — only when ALL units are filled
========================================= */

async function submitGroup() {

  var it = ITEMS[G.itemId];

  // 1) every unit complete?
  for (var i = 0; i < G.units.length; i++) {
    var u = G.units[i];
    if (!u.savedId && missing(u, it).length) {
      G.showErr[i] = true;
      G.cur = i;
      renderSheet();
      toast('Unit ' + (i + 1) + ' is not complete');
      return;
    }
  }

  // 2) same barcode twice in this group?
  var seen = {};
  for (var j = 0; j < G.units.length; j++) {
    var b = G.units[j].barcode;
    if (!b) continue;
    if (seen[b] !== undefined) {
      G.cur = j; renderSheet();
      showErr('Barcode ' + b + ' is used for Unit ' + (seen[b] + 1) + ' and Unit ' + (j + 1) + '.');
      return;
    }
    seen[b] = j;
  }

  if (navigator.onLine === false) { toast('No internet. Saved on this phone – try again when online.'); return; }

  var btn = $('fNext');
  btn.disabled = true;
  btn.textContent = 'Checking barcodes…';

  var group = G;

  try {

    // 3) barcode already registered anywhere?
    var pending = group.units.filter(function (x) { return !x.savedId; });
    var codes = pending.map(function (x) { return x.barcode; }).filter(Boolean);
    if (codes.length) {
      var chk = await callServer('checkBarcodes', codes);
      if (chk && chk.success && chk.duplicates.length) {
        var d0 = chk.duplicates[0];
        var idx = group.units.findIndex(function (x) { return x.barcode === d0.barcode; });
        if (idx > -1) { group.cur = idx; renderSheet(); }
        showErr('Barcode ' + d0.barcode + ' is already registered as ' + d0.assetId + ' (' + d0.outlet + '). Check the sticker.');
        return;
      }
    }

    // 4) upload units one by one (a retry never duplicates)
    var total = group.units.length;
    for (var k = 0; k < total; k++) {

      var unit = group.units[k];
      if (unit.savedId) continue;

      btn.textContent = 'Uploading ' + (k + 1) + ' of ' + total + '…';

      var r = await callServer('saveAsset', {
        outlet: group.outlet, collectedBy: S.name, mobile: S.mobile,
        itemId: group.itemId, submissionId: group.groupId, uid: unit.uid,
        unitNo: k + 1, unitTotal: total,
        barcode: unit.barcode, noSticker: unit.noSticker,
        brand: unit.brand, model: unit.model, specs: unit.specs,
        condition: unit.condition, conditionOther: unit.conditionOther,
        repairCount: unit.repairCount, repairIssue: unit.repairIssue, repairIssueOther: unit.repairIssueOther,
        remarks: unit.remarks, photos: unit.photos
      });

      if (!r || !r.success) {
        group.cur = k; renderSheet();
        showErr('Unit ' + (k + 1) + ' not saved: ' + esc((r && r.message) || 'unknown error') +
          '<br>Fix it and tap Submit again — saved units are not sent twice.');
        await DB.put(draftKey(group.outlet, group.itemId), group);
        return;
      }

      unit.savedId = r.id;
      unit.photos = {};                       // free phone storage
      await DB.put(draftKey(group.outlet, group.itemId), group);

    }

    // 5) all done
    var ids = group.units.map(function (x) { return x.savedId; });
    S.registered[group.itemId] = n(S.registered[group.itemId]) + ids.length;

    var newCount = Math.max(n(S.saved[group.itemId]), have(group.itemId));
    if (newCount !== n(S.saved[group.itemId])) {
      var cc = {}; cc[group.itemId] = newCount;
      callServer('saveCounts', { outlet: group.outlet, collectedBy: S.name, mobile: S.mobile, counts: cc })
        .catch(function () {});
      S.saved[group.itemId] = newCount;
      S.counts[group.itemId] = Math.max(n(S.counts[group.itemId]), newCount);
    }

    await DB.del(draftKey(group.outlet, group.itemId));
    S.drafts = S.drafts.filter(function (d) { return d.itemId !== group.itemId; });

    closeSheet();

    var next = nextPending();
    var buttons = next
      ? [{ t: 'Next: ' + nameOf(next) + ' →', v: 'next' }, { t: 'Close', v: '', cls: 'sec' }]
      : [{ t: 'Done', v: '' }];

    var go = await ask('✅ ' + nameOf(it) + ' – ' + ids.length + ' registered',
      (APP.API_URL ? '' : '<p class="hint">Saved on this phone. It goes to the Google Sheet automatically once connected; final Asset IDs are given then.</p>') +
      '<p>Asset IDs:</p><div class="ids">' + ids.map(function (x) { return '<span class="aid">' + esc(x) + '</span>'; }).join('') + '</div>',
      buttons);

    if (go === 'next' && next) openItem(next.id);

  } catch (e) {

    showErr('Network problem: ' + esc(e.message || e) + '<br>Your entries are saved on this phone. Tap Submit again.');
    await DB.put(draftKey(group.outlet, group.itemId), group);

  } finally {

    if (G === group) {
      btn.disabled = false;
      var leftNow = group.units.filter(function (x) { return !x.savedId; }).length;
      if (group.cur === group.units.length - 1) btn.textContent = 'Submit all ' + leftNow + ' ✓';
      else btn.textContent = 'Next: Unit ' + (group.cur + 2) + ' →';
      refreshPills();
    }

  }

}

function showErr(html) {
  var b = $('unitErr');
  if (!b) { toast(html.replace(/<[^>]+>/g, ' ')); return; }
  b.innerHTML = html;
  b.style.display = 'block';
  $('shBody').scrollTop = 0;
}

</script>
