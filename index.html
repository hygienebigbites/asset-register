/* =========================================
   PHOTO TILE (auto-compressed)
========================================= */

function photoTile(u, p, wrap) {

  var t = el('button', 'ph');
  t.type = 'button';
  var input = $('photoInput');

  function nativeCamera() {
    input.value = '';
    input.onchange = onNativeFile;
    input.click();
  }

  function setPhoto(r) {
    if (!(r && r.data)) {
      if (r !== null) toast('Could not read that photo. Please retake.');
      paint();
      return;
    }
    t.innerHTML = '<span class="ic">🔍</span>Checking…';
    checkPhoto(r, u, p).then(function (issues) {
      if (!issues.length) { keep(r); return; }
      ask('Check this photo', '<img class="pc-img" src="data:image/jpeg;base64,' + r.data + '" alt="">' +
        '<p>' + esc(p.label) + ' photo ' + esc(issues.join(', ')) + '.</p>' +
        '<p class="hint">A clear photo helps the R&amp;M team identify this unit later.</p>',
        [{ t: '📷 Retake photo', v: 'retake' }, { t: 'It\'s correct – use it', v: 'use', cls: 'sec' }]
      ).then(function (v) {
        if (v === 'use') { r.flag = issues.join(', '); keep(r); }
        else { paint(); t.click(); }
      });
    });
  }

  function keep(r) {
    u.photos[p.key] = r;
    wrap.classList.remove('err');
    changed();
    saveDraftNow();
    paint();
  }

  t.onclick = function () {
    if (!camOK()) { nativeCamera(); return; }          // old phone: use the phone camera app
    openCamera('photo', p.label).then(function (r) {
      if (r === 'fallback') { nativeCamera(); return; }
      if (r) setPhoto(r);
    });
  };

  function paint() {
    var ph = u.photos[p.key];
    t.className = 'ph' + (ph && ph.data ? ' has' : '');
    t.innerHTML = '';
    if (ph && ph.data) {
      t.appendChild(el('img', '')).src = 'data:' + (ph.mimeType || 'image/jpeg') + ';base64,' + ph.data;
      t.appendChild(el('span', 'tag', esc(p.label) + ' · retake'));
    } else {
      t.innerHTML = '<span class="ic">📷</span>' + esc(p.label) + (p.required ? ' <span class="rq">*</span>' : '');
    }
  }

  function onNativeFile() {
    if (!input.files || !input.files.length) return;
    var file = input.files[0];
    t.innerHTML = '<span class="ic">⏳</span>Preparing…';
    compressImage(file).then(function (r) { input.value = ''; setPhoto(r || false); });
  }

  paint();
  return t;

}

/* Resize to max 1280px JPEG (~150–300 KB instead of 3–6 MB). */
function compressImage(file, max, quality) {

  max = max || 1280; quality = quality || 0.72;

  return new Promise(function (resolve) {

    function fallback() {
      var reader = new FileReader();
      reader.onload = function (e) { resolve({ data: e.target.result.split(',')[1], mimeType: file.type || 'image/jpeg' }); };
      reader.onerror = function () { resolve(null); };
      reader.readAsDataURL(file);
    }

    // low-memory path: let the browser decode straight to a small size
    if (window.createImageBitmap && max <= 1600) {
      createImageBitmap(file, { resizeWidth: max, resizeQuality: 'medium' }).then(function (bmp) {
        var k = Math.min(1, max / Math.max(bmp.width, bmp.height));
        var canvas = document.createElement('canvas');
        canvas.width = Math.round(bmp.width * k);
        canvas.height = Math.round(bmp.height * k);
        canvas.getContext('2d').drawImage(bmp, 0, 0, canvas.width, canvas.height);
        if (bmp.close) bmp.close();
        var dataUrl = canvas.toDataURL('image/jpeg', quality);
        canvas.width = canvas.height = 0;
        resolve({ data: dataUrl.split(',')[1], mimeType: 'image/jpeg' });
      }).catch(function () { classic(); });
      return;
    }
    classic();

    function classic() {
    try {
      var url = URL.createObjectURL(file);
      var img = new Image();
      img.onload = function () {
        try {
          var w = img.naturalWidth, h = img.naturalHeight;
          var scale = Math.min(1, max / Math.max(w, h));
          var canvas = document.createElement('canvas');
          canvas.width = Math.round(w * scale);
          canvas.height = Math.round(h * scale);
          canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
          var dataUrl = canvas.toDataURL('image/jpeg', quality);
          URL.revokeObjectURL(url);
          resolve({ data: dataUrl.split(',')[1], mimeType: 'image/jpeg' });
        } catch (e) { fallback(); }
      };
      img.onerror = function () { fallback(); };
      img.src = url;
    } catch (e) { fallback(); }
    }

  });

}


/* =========================================
   PHOTO CHECKS (on the phone, instant)
   blurry · too dark · too bright · empty/covered · same photo twice
========================================= */

function photoStats(ph) {
  return new Promise(function (resolve) {
    var img = new Image();
    img.onload = function () {
      try {
        var w = 200, h = Math.max(8, Math.round(img.naturalHeight * w / img.naturalWidth));
        var c = document.createElement('canvas'); c.width = w; c.height = h;
        var x = c.getContext('2d');
        x.drawImage(img, 0, 0, w, h);
        var d = x.getImageData(0, 0, w, h).data;
        var g = new Float32Array(w * h), sum = 0, sq = 0, i;
        for (i = 0; i < w * h; i++) { g[i] = 0.299 * d[i * 4] + 0.587 * d[i * 4 + 1] + 0.114 * d[i * 4 + 2]; sum += g[i]; }
        var mean = sum / (w * h);
        for (i = 0; i < w * h; i++) sq += (g[i] - mean) * (g[i] - mean);
        var std = Math.sqrt(sq / (w * h));
        // sharpness = variance of the Laplacian
        var ls = 0, ls2 = 0, cnt = 0;
        for (var yy = 1; yy < h - 1; yy++) for (var xx = 1; xx < w - 1; xx++) {
          var k = yy * w + xx;
          var l = g[k - 1] + g[k + 1] + g[k - w] + g[k + w] - 4 * g[k];
          ls += l; ls2 += l * l; cnt++;
        }
        var lap = ls2 / cnt - (ls / cnt) * (ls / cnt);
        // fingerprint (difference hash 9x8) to spot the same photo used twice
        c.width = 9; c.height = 8;
        x.drawImage(img, 0, 0, 9, 8);
        var s8 = x.getImageData(0, 0, 9, 8).data, bits = '';
        for (var r = 0; r < 8; r++) for (var q = 0; q < 8; q++) {
          var a = (r * 9 + q) * 4, b = (r * 9 + q + 1) * 4;
          bits += (s8[a] + s8[a + 1] + s8[a + 2]) > (s8[b] + s8[b + 1] + s8[b + 2]) ? '1' : '0';
        }
        c.width = c.height = 0;
        resolve({ mean: mean, std: std, lap: lap, hash: bits });
      } catch (e) { resolve(null); }
    };
    img.onerror = function () { resolve(null); };
    img.src = 'data:' + (ph.mimeType || 'image/jpeg') + ';base64,' + ph.data;
  });
}

function hamming(a, b) {
  if (!a || !b || a.length !== b.length) return 99;
  var n2 = 0;
  for (var i = 0; i < a.length; i++) if (a[i] !== b[i]) n2++;
  return n2;
}

/* returns a list of problems (empty = fine); stores the fingerprint on the photo */
function checkPhoto(ph, u, p) {
  return photoStats(ph).then(function (q) {
    var issues = [];
    if (!q) return issues;
    ph.hash = q.hash;
    if (q.mean < 45) issues.push('is too dark – turn on the light or move closer to it');
    else if (q.mean > 245) issues.push('is too bright – avoid pointing at a light or window');
    else if (q.std < 8) issues.push('looks empty – lens covered or only a wall');
    else if (q.lap < 12) issues.push('is blurry – hold the phone still');
    if (G) {
      G.units.forEach(function (other, ui) {
        Object.keys(other.photos || {}).forEach(function (key) {
          if (other === u && key === p.key) return;
          var o = other.photos[key];
          if (o && o.hash && hamming(o.hash, q.hash) <= 4) {
            issues.push(other === u ? 'looks the same as another photo of this unit'
                                    : 'looks the same as the Unit ' + (ui + 1) + ' photo – each unit needs its own photo');
          }
        });
      });
    }
    return issues.filter(function (x, i, arr) { return arr.indexOf(x) === i; });
  });
}

function photoFlagText(unit) {
  var it = ITEMS[G ? G.itemId : ''];
  var labels = {};
  if (it) it.photos.forEach(function (ph) { labels[ph.key] = ph.label; });
  var flags = Object.keys(unit.photos || {}).filter(function (k) { return unit.photos[k] && unit.photos[k].flag; })
    .map(function (k) { return (labels[k] || 'Label') + ': ' + unit.photos[k].flag; });
  return flags.length ? '[Photo check – ' + flags.join('; ') + '] ' : '';
}


/* =========================================
   IN-APP CAMERA
   Phones with little memory close the browser when the camera app
   opens ("Unable to complete previous operation due to low memory").
   Taking the photo / scanning inside the page avoids that.
========================================= */

var CAM = { stream: null, mode: '', resolve: null, timer: null, reader: null, busy: false, failed: false };

function camOK() {
  return !CAM.failed && window.isSecureContext && !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
}

/* mode 'photo' → {data, mimeType}; mode 'scan' → barcode text;
   null = closed; 'fallback' = use the phone camera app instead */
function openCamera(mode, title) {
  return new Promise(function (resolve) {
    CAM.mode = mode; CAM.resolve = resolve;
    $('camTitle').textContent = title;
    $('camHint').textContent = mode === 'scan'
      ? 'Point at the barcode sticker. It reads by itself.'
      : 'Keep the full item inside the frame, then tap the round button.';
    $('camShot').classList.toggle('hide', mode === 'scan');
    $('camFrame').classList.toggle('scan', mode === 'scan');
    $('cam').classList.add('open');
    navigator.mediaDevices.getUserMedia({
      audio: false,
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 960 } }
    }).then(function (st) {
      if (!CAM.resolve) { st.getTracks().forEach(function (t) { t.stop(); }); return; }
      CAM.stream = st;
      var v = $('camVideo');
      v.srcObject = st;
      v.play().catch(function () {});
      if (mode === 'scan') startScanLoop();
    }).catch(function () {
      CAM.failed = true;                // next time go straight to the phone camera
      toast('Camera not allowed here – opening the phone camera');
      closeCamera('fallback');
    });
  });
}

function closeCamera(result) {
  clearInterval(CAM.timer); CAM.timer = null;
  CAM.paused = false;
  $('camConfirm').classList.add('hide');
  if (CAM.reader) { try { CAM.reader.reset(); } catch (e) {} CAM.reader = null; }
  if (CAM.stream) { CAM.stream.getTracks().forEach(function (t) { t.stop(); }); CAM.stream = null; }
  var v = $('camVideo');
  v.pause(); v.srcObject = null;
  $('cam').classList.remove('open');
  var r = CAM.resolve; CAM.resolve = null;
  if (r) r(result === undefined ? null : result);
}

function capturePhoto() {
  var v = $('camVideo');
  if (!v.videoWidth) { toast('Camera is starting…'); return; }
  var max = 1280;
  var k = Math.min(1, max / Math.max(v.videoWidth, v.videoHeight));
  var c = document.createElement('canvas');
  c.width = Math.round(v.videoWidth * k);
  c.height = Math.round(v.videoHeight * k);
  c.getContext('2d').drawImage(v, 0, 0, c.width, c.height);
  var dataUrl = c.toDataURL('image/jpeg', 0.72);
  c.width = c.height = 0;
  closeCamera({ data: dataUrl.split(',')[1], mimeType: 'image/jpeg' });
}

/* A real sticker code: letters, numbers and - _ / .  (4 to 40 long).
   Misreads often contain symbols like & ' % — those are rejected. */
var BARCODE_PATTERN = /^[A-Z0-9][A-Z0-9\-_\/.]{3,39}$/;

function cleanCode(raw) {
  return String(raw || '').trim().toUpperCase().replace(/\s+/g, '');
}
function validCode(code) { return BARCODE_PATTERN.test(code); }

/* camera keeps reading; a code is accepted only after the SAME valid value
   is read twice in a row, then staff confirm it */
function startScanLoop() {
  var v = $('camVideo');
  var last = '', hits = 0, bad = 0;

  var known = store.get('kap_bc_format');     // sticker type learned from confirmed scans

  /* list = [{ v: text, f: format }] */
  function onRead(list) {
    if (!CAM.resolve || CAM.paused) return;
    var reads = list.map(function (x) { return { v: cleanCode(x.v), f: String(x.f || '') }; })
      .filter(function (x) { return x.v; });
    var good = reads.filter(function (x) { return validCode(x.v) && (!known || !x.f || x.f === known); });
    if (!good.length) {
      if (reads.length && ++bad % 4 === 0) $('camHint').textContent = 'Not clear yet – hold steady, closer, with good light.';
      hits = 0; last = '';
      return;
    }
    var r = good[0];
    if (r.v === last) hits++; else { last = r.v; hits = 1; }
    $('camHint').textContent = 'Reading… hold still';
    if (hits >= SCAN_MATCHES) { CAM.paused = true; showScanConfirm(r.v, r.f); }
  }

  var det = null;
  if ('BarcodeDetector' in window) { try { det = new BarcodeDetector(); } catch (e) { det = null; } }
  if (det) {
    CAM.timer = setInterval(function () {
      if (!v.videoWidth || CAM.busy || CAM.paused) return;
      CAM.busy = true;
      det.detect(v).then(function (r) {
        CAM.busy = false;
        // biggest barcode first (the sticker in front, not one in the background)
        r = (r || []).slice().sort(function (x, y) {
          var ax = x.boundingBox ? x.boundingBox.width * x.boundingBox.height : 0;
          var ay = y.boundingBox ? y.boundingBox.width * y.boundingBox.height : 0;
          return ay - ax;
        });
        onRead(r.map(function (x) { return { v: x.rawValue, f: x.format }; }));
      }).catch(function () { CAM.busy = false; });
    }, 250);
    return;
  }

  loadZXing().then(function () {
    if (!CAM.stream) return;
    var hints = new Map();
    hints.set(ZXing.DecodeHintType.TRY_HARDER, true);
    var reader = new ZXing.MultiFormatReader();
    reader.setHints(hints);
    var c = document.createElement('canvas');
    CAM.timer = setInterval(function () {
      if (!v.videoWidth || CAM.busy || CAM.paused) return;
      CAM.busy = true;
      try {
        var k = Math.min(1, 960 / Math.max(v.videoWidth, v.videoHeight));
        c.width = Math.round(v.videoWidth * k); c.height = Math.round(v.videoHeight * k);
        c.getContext('2d').drawImage(v, 0, 0, c.width, c.height);
        var bmp = new ZXing.BinaryBitmap(new ZXing.HybridBinarizer(new ZXing.HTMLCanvasElementLuminanceSource(c)));
        var res = reader.decode(bmp);
        onRead(res ? [{ v: res.getText(), f: zxFormat(res.getBarcodeFormat()) }] : []);
      } catch (e) { /* nothing found in this frame */ }
      CAM.busy = false;
    }, 350);
  }).catch(function () {
    $('camHint').textContent = 'Scanner could not load. Close and type the number.';
  });
}

var SCAN_MATCHES = 3;   // same code read this many times in a row before it is shown

/* ZXing format number → same names the phone's own scanner uses */
function zxFormat(f) {
  var names = ['aztec', 'codabar', 'code_39', 'code_93', 'code_128', 'data_matrix', 'ean_8', 'ean_13', 'itf',
               'maxicode', 'pdf417', 'qr_code', 'rss_14', 'rss_expanded', 'upc_a', 'upc_e', 'upc_ean_extension'];
  return names[f] || '';
}

function showScanConfirm(code, format) {
  $('camCode').textContent = code;
  $('camConfirm').classList.remove('hide');
  $('camHint').textContent = '';
  $('camUse').onclick = function () {
    if (format) store.set('kap_bc_format', format);   // only read this sticker type from now on
    $('camConfirm').classList.add('hide'); CAM.paused = false; closeCamera(code);
  };
  $('camAgain').onclick = function () {
    $('camConfirm').classList.add('hide');
    $('camHint').textContent = 'Point at the barcode sticker. It reads by itself.';
    CAM.paused = false;
    startScanLoop();
  };
}


/* =========================================
   BARCODE SCAN (photo → decode)
   Uses the phone camera app, so it works inside Apps Script.
========================================= */

var zxingP = null;
function loadZXing() {
  if (window.ZXing) return Promise.resolve();
  if (zxingP) return zxingP;
  zxingP = new Promise(function (res, rej) {
    var s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js';
    s.onload = res;
    s.onerror = function () { zxingP = null; rej(new Error('Scanner could not load')); };
    document.head.appendChild(s);
  });
  return zxingP;
}

async function decodeBarcode(file) {

  var small = await compressImage(file, 1600, 0.9);
  if (!small) return null;
  var dataUrl = 'data:image/jpeg;base64,' + small.data;

  if ('BarcodeDetector' in window) {
    try {
      var img = new Image();
      await new Promise(function (r, j) { img.onload = r; img.onerror = j; img.src = dataUrl; });
      var found = await new BarcodeDetector().detect(img);
      if (found && found.length) return found[0].rawValue;
    } catch (e) { /* fall back to ZXing */ }
  }

  await loadZXing();
  var hints = new Map();
  hints.set(ZXing.DecodeHintType.TRY_HARDER, true);
  var reader = new ZXing.BrowserMultiFormatReader(hints);
  try {
    var res = await reader.decodeFromImageUrl(dataUrl);
    return res ? res.getText() : null;
  } catch (e) {
    return null;
  }

}

async function onScanFile() {

  var input = $('scanInput');
  if (!G || !input.files || !input.files.length) return;

  var u = G.units[G.cur];
  var msg = $('bcMsg');
  if (msg) { msg.className = 'msg wait'; msg.textContent = 'Reading barcode…'; }

  var code = null;
  try { code = await decodeBarcode(input.files[0]); } catch (e) { code = null; }

  if (!G || G.units[G.cur] !== u) return;

  if (!code) {
    if (msg) { msg.className = 'msg bad'; msg.textContent = 'Could not read it. Hold closer with good light, or type the number.'; }
    return;
  }

  applyBarcode(u, code);

}

function applyBarcode(u, code) {

  if (!G || G.units[G.cur] !== u) return;
  var msg = $('bcMsg');
  code = cleanCode(code);

  if (!validCode(code)) {
    if (msg) { msg.className = 'msg bad'; msg.textContent = 'Could not read the sticker correctly. Scan again closer, or type the number printed on it.'; }
    return;
  }

  var dupe = G.units.some(function (x) { return x !== u && x.barcode === code; });
  if (dupe) {
    if (msg) { msg.className = 'msg bad'; msg.textContent = code + ' is already used for another unit here.'; }
    return;
  }

  u.barcode = code;
  u.scanned = true;
  changed();
  saveDraftNow();
  renderUnitForm(ITEMS[G.itemId], u, false);
  var m2 = $('bcMsg');
  if (m2) { m2.className = 'msg ok'; m2.textContent = '✓ Scanned ' + code; }

}


/* =========================================
   SUBMIT GROUP — only when ALL units are filled
========================================= */

async function submitGroup() {

  var it = ITEMS[G.itemId];

  // 1) every unit complete?
  for (var i = 0; i < G.units.length; i++) {
    var u = G.units[i];
    if (!u.savedId && missing(u, it).length) {
      G.showErr[i] = true;
      G.cur = i;
      renderSheet();
      toast('Unit ' + (i + 1) + ' is not complete');
      return;
    }
  }

  // 2) same barcode twice in this group?
  var seen = {};
  for (var j = 0; j < G.units.length; j++) {
    var b = G.units[j].barcode;
    if (!b) continue;
    if (seen[b] !== undefined) {
      G.cur = j; renderSheet();
      showErr('Barcode ' + b + ' is used for Unit ' + (seen[b] + 1) + ' and Unit ' + (j + 1) + '.');
      return;
    }
    seen[b] = j;
  }

  if (APP.API_URL && navigator.onLine === false) { toast('No internet. Saved on this phone – try again when online.'); return; }

  var toSend = G.units.filter(function (x) { return !x.savedId; });
  var list = toSend.map(function (x) {
    var i2 = G.units.indexOf(x) + 1;
    var ph = x.photos && x.photos.photo1;
    return '<div class="rv-row rv-unit">' +
      (ph ? '<img class="rv-ph" src="data:' + (ph.mimeType || 'image/jpeg') + ';base64,' + ph.data + '" alt="">' : '') +
      '<span>Unit ' + i2 + ' · ' + esc(x.brand || nameOf(it)) + ' · ' + esc(x.condition) + ' · ' + esc(x.usage) +
      (photoFlagText(x) ? '<br><em class="rv-flag">⚠ photo marked as unclear</em>' : '') + '</span>' +
      '<b class="aid" style="font-size:12.5px">' + esc(x.noSticker ? 'no sticker' : x.barcode) + '</b></div>';
  }).join('');
  var ok = await ask('Submit ' + toSend.length + ' × ' + nameOf(it) + '?',
    '<div class="ref" style="margin-bottom:8px"><img src="' + esc(imgSrc(it)) + '" alt=""><span>Each photo below should show a <b>' + esc(nameOf(it).toLowerCase()) + '</b> like this. ' +
    'Check each barcode matches the sticker on that unit.</span></div><div class="rv">' + list + '</div>' +
    '<p class="hint" style="margin:-4px 0 12px">After submitting, changes can only be made by the R&amp;M team.</p>',
    [{ t: 'Yes, submit', v: 'go' }, { t: '← Back to check', v: '', cls: 'sec' }]);
  if (ok !== 'go') return;

  var btn = $('fNext');
  btn.disabled = true;
  btn.textContent = 'Checking barcodes…';

  var group = G;

  try {

    // 3) barcode already registered anywhere?
    var pending = group.units.filter(function (x) { return !x.savedId; });
    var codes = pending.map(function (x) { return x.barcode; }).filter(Boolean);
    if (codes.length) {
      var chk = await callServer('checkBarcodes', codes);
      if (chk && chk.success && chk.duplicates.length) {
        var d0 = chk.duplicates[0];
        var idx = group.units.findIndex(function (x) { return x.barcode === d0.barcode; });
        if (idx > -1) { group.cur = idx; renderSheet(); }
        showErr('Barcode ' + d0.barcode + ' is already registered as ' + d0.assetId + ' (' + d0.outlet + '). Check the sticker.');
        return;
      }
    }

    // 4) upload units one by one (a retry never duplicates)
    var total = group.units.length;
    for (var k = 0; k < total; k++) {

      var unit = group.units[k];
      if (unit.savedId) continue;

      btn.textContent = 'Uploading ' + (k + 1) + ' of ' + total + '…';

      var r = await callServer('saveAsset', {
        outlet: group.outlet, collectedBy: S.name, mobile: S.mobile,
        itemId: group.itemId, submissionId: group.groupId, uid: unit.uid,
        unitNo: k + 1, unitTotal: total,
        barcode: unit.barcode, noSticker: unit.noSticker,
        brand: unit.brand, model: unit.model, specs: unit.specs,
        condition: unit.condition, conditionOther: unit.conditionOther, usage: unit.usage,
        repairCount: unit.repairCount, repairIssue: unit.repairIssue, repairIssueOther: unit.repairIssueOther,
        remarks: photoFlagText(unit) + (unit.remarks || ''), photos: unit.photos
      });

      if (!r || !r.success) {
        group.cur = k; renderSheet();
        showErr('Unit ' + (k + 1) + ' not saved: ' + esc((r && r.message) || 'unknown error') +
          '<br>Fix it and tap Submit again — saved units are not sent twice.');
        await DB.put(draftKey(group.outlet, group.itemId), group);
        return;
      }

      unit.savedId = r.id;
      unit.photos = {};                       // free phone storage
      await DB.put(draftKey(group.outlet, group.itemId), group);

    }

    // 5) all done
    var ids = group.units.map(function (x) { return x.savedId; });
    S.registered[group.itemId] = n(S.registered[group.itemId]) + ids.length;

    var newCount = Math.max(n(S.saved[group.itemId]), have(group.itemId));
    if (newCount !== n(S.saved[group.itemId])) {
      var cc = {}; cc[group.itemId] = newCount;
      callServer('saveCounts', { outlet: group.outlet, collectedBy: S.name, mobile: S.mobile, counts: cc })
        .catch(function () {});
      S.saved[group.itemId] = newCount;
      S.counts[group.itemId] = Math.max(n(S.counts[group.itemId]), newCount);
    }

    await DB.del(draftKey(group.outlet, group.itemId));
    S.drafts = S.drafts.filter(function (d) { return d.itemId !== group.itemId; });

    closeSheet();

    var next = nextPending();
    var buttons = next
      ? [{ t: 'Next: ' + nameOf(next) + ' →', v: 'next' }, { t: 'Close', v: '', cls: 'sec' }]
      : [{ t: 'Done', v: '' }];

    var go = await ask('✅ ' + nameOf(it) + ' – ' + ids.length + ' registered',
      (APP.API_URL ? '' : '<p class="hint">Saved on this phone. It goes to the Google Sheet automatically once connected; final Asset IDs are given then.</p>') +
      '<p>Asset IDs:</p><div class="ids">' + ids.map(function (x) { return '<span class="aid">' + esc(x) + '</span>'; }).join('') + '</div>',
      buttons);

    if (go === 'next' && next) openItem(next.id);

  } catch (e) {

    showErr('Network problem: ' + esc(e.message || e) + '<br>Your entries are saved on this phone. Tap Submit again.');
    await DB.put(draftKey(group.outlet, group.itemId), group);

  } finally {

    if (G === group) {
      btn.disabled = false;
      var leftNow = group.units.filter(function (x) { return !x.savedId; }).length;
      if (group.cur === group.units.length - 1) btn.textContent = 'Submit all ' + leftNow + ' ✓';
      else btn.textContent = 'Next: Unit ' + (group.cur + 2) + ' →';
      refreshPills();
    }

  }

}

function showErr(html) {
  var b = $('unitErr');
  if (!b) { toast(html.replace(/<[^>]+>/g, ' ')); return; }
  b.innerHTML = html;
  b.style.display = 'block';
  $('shBody').scrollTop = 0;
}

</script>
